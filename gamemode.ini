[general]
# User-safe opts - GPU opts live in /etc/gamemode.ini (see below)
reaper_freq=5
desiredgov=performance
defaultgov=powersave
softrealtime=auto
renice=0
ioprio=0
inhibit_screensaver=1
disable_splitlock=1

[custom]
# Notify when gamemode starts/stops - useful to confirm it's working
start=notify-send 'GameMode started' '%GAMENAME%' -a 'GameMode'
end=notify-send 'GameMode ended' '%GAMENAME%' -a 'GameMode'
